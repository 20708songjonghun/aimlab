<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aim Lab Web - 2D Aim Trainer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="game-container">
    <div id="hud" class="hidden">
      <div class="hud-item">
        <div class="hud-label">Time</div>
        <div class="hud-value" id="hud-time">60</div>
      </div>
      <div class="hud-item">
        <div class="hud-label">Score</div>
        <div class="hud-value" id="hud-score">0</div>
      </div>
      <div class="hud-item">
        <div class="hud-label">Accuracy</div>
        <div class="hud-value" id="hud-accuracy">100%</div>
      </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="main-menu" class="screen">
      <h1>Aim Lab Web</h1>
      <div class="setting-item">
        <label for="sens-input">Sens Multiplier:</label>
        <input type="range" id="sens-input" min="0.5" max="3" step="0.1" value="1" />
        <span id="sens-val">1.0</span>
      </div>
      <button class="btn" id="start-btn">Start Gridshot (6x10)</button>
    </div>

    <div id="pause-screen" class="screen hidden">
      <h1>Game Paused</h1>
      <p style="color: #94a3b8; margin-bottom: 20px;">클릭하여 계속하기 또는 ESC를 눌러 메뉴로 이동</p>
      <button class="btn" id="resume-btn">Resume</button>
      <button class="btn" id="quit-btn" style="background-color: #ef4444; color: #fff;">Quit Game</button>
    </div>

    <div id="result-screen" class="screen hidden">
      <div class="card">
        <h2>Results</h2>
        <div class="stats-grid">
          <div class="stat-box">
            <div class="hud-label">Final Score</div>
            <div class="val" id="res-score">0</div>
          </div>
          <div class="stat-box">
            <div class="hud-label">Accuracy</div>
            <div class="val" id="res-accuracy">0%</div>
          </div>
          <div class="stat-box">
            <div class="hud-label">Avg Reaction</div>
            <div class="val" id="res-reaction">0 ms</div>
          </div>
          <div class="stat-box">
            <div class="hud-label">Hits / Misses</div>
            <div class="val" id="res-hits">0 / 0</div>
          </div>
        </div>
        <button class="btn" id="retry-btn">Retry</button>
        <button class="btn" id="menu-btn" style="background-color: #64748b; color: #fff;">Menu</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
